# ChopCast default configuration.
# All values are documented in docs/CONFIGURATION.md §3.
# A profile overlay (configs/<profile>.yaml) and the .env file can override these.

paths:
  root: "."
  raw_db: "${paths.root}/data/raw/pireps.db"
  raw_dir: "${paths.root}/data/raw"
  processed_dir: "${paths.root}/data/processed"
  features_dir: "${paths.root}/data/features"
  models_dir: "${paths.root}/models/registry"
  registry_db: "${paths.root}/models/registry/registry.db"
  runs_dir: "${paths.root}/runs"
  logs_dir: "${paths.root}/logs"
  backups_dir: "${paths.root}/backups"

collector:
  source_url: "https://aviationweather.gov/data/cache/aircraftreports.cache.csv.gz"
  user_agent: "chopcast/0.1 (+contact@example.com)"
  poll_seconds: 600
  request_timeout_seconds: 60
  max_retries: 5
  max_backoff_seconds: 300
  backoff_base_seconds: 5
  validation:
    lat_range: [-90.0, 90.0]
    lon_range: [-180.0, 180.0]
    require_raw_text: true
    require_obs_time: false
  dedup:
    lat_decimals: 4
    lon_decimals: 4

database:
  journal_mode: "WAL"
  foreign_keys: true
  busy_timeout_ms: 5000
  backup:
    enabled: true
    schedule: "03:00"
    retention_days: 30
    destination: "${paths.backups_dir}"

processing:
  parser_version: "v1"
  labeler_version: "v1"
  cleaner_version: "v1"
  feature_builder_version: "v1"
  cleaner:
    strip_fields: ["/TB"]
    drop_tb_block: true
    lowercase: true
    collapse_whitespace: true
    preserve_remarks_tb_mentions: true
  features:
    altitude_bands: [[0, 20000], [20000, 30000], [30000, 40000], [40000, 60000]]
    aircraft_unknown_token: "<UNK>"
    use_hour_of_day: true
    use_day_of_year: true

labeling:
  rules_path: "${paths.root}/configs/labeling.yaml"
  default_label: "None"

text:
  stop_words_path: "${paths.root}/configs/stop_words.txt"
  tfidf:
    ngram_range: [1, 2]
    min_df: 5
    max_df: 0.95
    sublinear_tf: true
  transformer:
    model_name: "distilbert-base-uncased"
    max_length: 128
    truncation: "head_tail"

training:
  default_split:
    mode: "stratified"
    test_size: 0.2
    seed: 42
  baseline:
    kind: "logreg"
    class_weight: "balanced"
    max_iter: 1000
    C: 1.0
  transformer:
    epochs: 3
    batch_size: 16
    learning_rate: 5.0e-5
    warmup_steps: 100
    fp16: false
  imbalance:
    strategy: "class_weight"
  regression_gate:
    macro_f1_tolerance: 0.005
    per_class_f1_tolerance: 0.01

evaluation:
  classes: ["None", "Light", "Moderate", "Severe"]
  slice_columns: ["altitude_band", "report_type", "aircraft_type"]

weather:
  enabled: false
  provider: "metar"
  metar:
    source_url: "https://aviationweather.gov/api/data/metar"
    max_distance_km: 50
    max_time_delta_minutes: 60
  cache:
    path: "${paths.root}/data/weather/metar.parquet"
    retention_days: 30

api:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  request_body_log: false
  include_disclaimer_header: true

monitoring:
  prometheus:
    enabled: true
    path: "/metrics"
  drift:
    enabled: true
    method: "psi"
    threshold: 0.2
    window_size: 1000

logging:
  level: "INFO"
  format: "json"
  destination: "stdout"
  file_path: "${paths.logs_dir}/chopcast.log"
  rotate_max_bytes: 10485760
  rotate_backup_count: 5
